name: Validate Clothing save migration
on:
  push:
    branches: [codex/restore-bundled-clothing-to-local-saves]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:cloud
