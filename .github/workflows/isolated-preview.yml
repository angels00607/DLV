name: Isolated DLV preview build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - '.github/workflows/isolated-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_DLV_TEST_MODE: 'true'
      VITE_SUPABASE_URL: 'https://ohtxjbytcohglxtxpdzz.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DLV_TEST_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require isolated test key
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set DLV_TEST_SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi
      - name: Install and validate
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm install --frozen-lockfile
          npm run test:cloud
          pnpm run build
      - name: Upload preview bundle (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: dlv-isolated-preview
          path: dist-test/
          if-no-files-found: error
          retention-days: 7
