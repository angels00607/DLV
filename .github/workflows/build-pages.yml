name: Build GitHub Pages

on:
  push:
    branches:
      - main
      - fix/pages-workflow-pnpm-cache
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current application
        run: pnpm run build

      - name: Commit generated GitHub Pages files
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "build: refresh GitHub Pages [skip ci]"
          git push
