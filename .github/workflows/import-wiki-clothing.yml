name: One-time Clothing wiki import
on:
  push:
    branches: [codex/clothing-wiki-snapshot-import]
  workflow_dispatch:
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/clothing-wiki-snapshot-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - run: python scripts/import_wiki_clothing.py
      - name: Commit catalog if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import Clothing catalog from pinned wiki revision'
            git push
          fi
