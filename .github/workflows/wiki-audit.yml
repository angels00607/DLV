name: Wiki catalog audit (read only)

on:
  workflow_dispatch:
    inputs:
      snapshot_path:
        description: 'Path to reviewed JSON snapshot committed to this branch (required; wiki API is blocked)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate snapshot path
        env:
          SNAPSHOT_PATH: ${{ inputs.snapshot_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ['SNAPSHOT_PATH']
          path = Path(value)
          if path.is_absolute() or '..' in path.parts or not path.is_file() or path.suffix != '.json':
              raise SystemExit('Provide a committed relative .json snapshot file path; the blocked wiki API cannot be used.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SNAPSHOT_PATH={value}\n')
          PY
      - name: Generate candidate report
        id: audit
        continue-on-error: true
        run: python3 scripts/wiki_audit.py --catalog public/data.json --snapshot "$SNAPSHOT_PATH" --output wiki-sync-report.json
      - name: Summarize source status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("wiki-sync-report.json")
          if path.exists():
              data = json.loads(path.read_text())
              lines = ["## Wiki audit source status", ""]
              for category, details in data.get("categories", {}).items():
                  lines.append(f"- **{category}**: " + (f"ERROR — {details['error']}" if "error" in details else ("NOT CHECKED" if details.get("status") == "NOT_CHECKED" else f"{details['wikiPagesFound']} pages discovered")))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-sync-report
          path: wiki-sync-report.json
          if-no-files-found: warn
      - name: Fail if source discovery failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
