name: Wiki catalog audit (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate candidate report
        id: audit
        continue-on-error: true
        run: python3 scripts/wiki_audit.py --catalog public/data.json --output wiki-sync-report.json
      - name: Summarize source status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("wiki-sync-report.json")
          if path.exists():
              data = json.loads(path.read_text())
              lines = ["## Wiki audit source status", ""]
              for category, details in data.get("categories", {}).items():
                  lines.append(f"- **{category}**: " + (f"ERROR — {details['error']}" if "error" in details else f"{details['wikiPagesFound']} pages discovered"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\\n".join(lines) + "\\n")
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-sync-report
          path: wiki-sync-report.json
          if-no-files-found: warn
      - name: Fail if source discovery failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
