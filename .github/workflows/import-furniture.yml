name: Import complete Furniture catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_furniture_snapshot.py'
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python scripts/import_furniture_snapshot.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Import full Furniture wiki snapshot"
            git push
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
