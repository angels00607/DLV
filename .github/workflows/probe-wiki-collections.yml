name: Probe wiki collections access (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check robots policy and one collections page
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit
          from urllib.robotparser import RobotFileParser

          origin = "https://dreamlightvalleywiki.com"
          agent = "DLV-Guide-Collections-Research/1.0"
          robots_url = origin + "/robots.txt"
          try:
              request = urllib.request.Request(robots_url, headers={"User-Agent": agent})
              with urllib.request.urlopen(request, timeout=15) as response:
                  robots = response.read(256_000).decode("utf-8", "replace")
                  print(f"robots.txt HTTP {response.status}; bytes={len(robots)}")
              policy = RobotFileParser()
              policy.parse(robots.splitlines())
              if not policy.can_fetch(agent, origin + "/Collections"):
                  raise SystemExit("Robots policy does not permit this page; stopping without page request.")
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Could not verify robots policy ({type(error).__name__}); stopping without page request.")
          url = origin + "/Collections"
          try:
              request = urllib.request.Request(url, headers={"User-Agent": agent, "Accept": "text/html"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  content_type = response.headers.get("Content-Type", "")
                  body = response.read(256_000)
                  print(f"Collections HTTP {response.status}; content-type={content_type}; bytes={len(body)}")
                  if "text/html" not in content_type:
                      raise SystemExit("Unexpected content type; no data extracted.")
                  print("HTML access probe completed; no catalog or collection data stored.")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Collections HTTP {error.code}; stopping without retry.")
          except urllib.error.URLError as error:
              raise SystemExit(f"Collections access unavailable ({type(error).__name__}); stopping without retry.")
          PY
