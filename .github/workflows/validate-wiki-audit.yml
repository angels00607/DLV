name: Validate wiki audit

on:
  pull_request:
    paths:
      - 'scripts/wiki_audit.py'
      - 'tests/test_wiki_audit.py'
      - 'tests/fixtures/wiki-snapshot-example.json'
      - '.github/workflows/wiki-audit.yml'
      - '.github/workflows/validate-wiki-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test offline snapshot comparison
        run: python3 -m unittest discover -s tests -p 'test_wiki_audit.py' -v
      - name: Validate complete offline audit against real catalog and synthetic snapshot
        run: |
          python3 scripts/wiki_audit.py --catalog public/data.json --snapshot tests/fixtures/wiki-snapshot-example.json --output /tmp/wiki-audit-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/wiki-audit-smoke.json').read_text())
          assert report['snapshotMode'] is True
          assert report['categories']['clothing']['status'] == 'SNAPSHOT_COMPARED'
          assert report['categories']['furniture']['status'] == 'NOT_CHECKED'
          assert report['categories']['meals']['status'] == 'NOT_CHECKED'
          assert report['categories']['crafting']['status'] == 'NOT_CHECKED'
          assert report['categories']['clothing']['wikiPagesFound'] == 2
          print('Offline audit smoke test passed; synthetic fixture only, no wiki data imported.')
          PY
